<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALKARA PSİKOTEKNİK ÜNAL | Sürücü Sağlık Raporu ve Psikoteknik Hizmetleri</title>
<style>
:root {
  --primary: #0e7c86;
  --primary-dark: #095e66;
  --primary-light: #e8f6f7;
  --accent: #f59e0b;
  --accent-dark: #d97706;
  --bg: #f8fafb;
  --surface: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(14,124,134,0.08);
  --shadow-lg: 0 12px 48px rgba(14,124,134,0.12);
  --shadow-hover: 0 20px 60px rgba(14,124,134,0.16);
  --border: 1px solid rgba(14,124,134,0.1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── Topbar ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(14,124,134,0.08);
  padding: 0 24px;
  transition: box-shadow 0.3s;
}
.topbar-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}
.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #fff;
  flex-shrink: 0;
}
.logo-text {
  font-weight: 800;
  font-size: 16px;
  line-height: 1.15;
  letter-spacing: -0.3px;
}
.logo-text span {
  display: block;
  font-weight: 500;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.btn-call {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  transition: all 0.3s;
  box-shadow: 0 4px 16px rgba(14,124,134,0.3);
}
.btn-call:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(14,124,134,0.4);
}

/* ── Hero ── */
.hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, #041c22 0%, #0a3d44 35%, #0e7c86 70%, #12a5b2 100%);
  overflow: hidden;
  padding: 80px 24px;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 80%, rgba(245,158,11,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 70%);
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 120px;
  background: var(--bg);
  clip-path: ellipse(55% 100% at 50% 100%);
}
.hero-pattern {
  position: absolute;
  inset: 0;
  opacity: 0.04;
  background-image:
    radial-gradient(circle at 25% 25%, #fff 1px, transparent 1px),
    radial-gradient(circle at 75% 75%, #fff 1px, transparent 1px);
  background-size: 60px 60px;
}
.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 820px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  padding: 8px 20px;
  border-radius: 50px;
  color: rgba(255,255,255,0.9);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 28px;
  letter-spacing: 0.3px;
}
.hero h1 {
  font-size: clamp(2.2rem, 5.5vw, 3.8rem);
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 20px;
  letter-spacing: -1px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--accent), #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: rgba(255,255,255,0.78);
  max-width: 600px;
  margin: 0 auto 36px;
  line-height: 1.7;
}
.hero-phone {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  padding: 16px 32px;
  border-radius: 16px;
  margin-bottom: 32px;
  color: #fff;
  font-size: clamp(1.3rem, 3vw, 1.8rem);
  font-weight: 800;
  letter-spacing: 0.5px;
  text-decoration: none;
  transition: all 0.3s;
}
.hero-phone:hover {
  background: rgba(255,255,255,0.18);
  transform: scale(1.03);
}
.hero-phone svg { flex-shrink: 0; }
.hero-ctas {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  text-decoration: none;
  padding: 16px 36px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 16px;
  transition: all 0.3s;
  box-shadow: 0 6px 24px rgba(245,158,11,0.35);
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 36px rgba(245,158,11,0.45);
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  color: #fff;
  text-decoration: none;
  padding: 14px 34px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 16px;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.22);
  transform: translateY(-3px);
}

/* ── Section helpers ── */
.section {
  padding: 90px 24px;
}
.section-inner {
  max-width: 1100px;
  margin: 0 auto;
}
.section-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--primary);
  margin-bottom: 12px;
}
.section-label::before {
  content: '';
  width: 28px;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px;
}
.section-title {
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 900;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}
.section-subtitle {
  font-size: 1.05rem;
  color: var(--text-muted);
  max-width: 560px;
  line-height: 1.7;
}

/* ── Highlight Strip ── */
.highlight-strip {
  background: var(--surface);
  border-top: var(--border);
  border-bottom: var(--border);
}
.highlight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0;
}
.highlight-card {
  padding: 40px 32px;
  text-align: center;
  border-right: var(--border);
  transition: all 0.3s;
}
.highlight-card:last-child { border-right: none; }
.highlight-card:hover {
  background: var(--primary-light);
}
.highlight-icon {
  font-size: 40px;
  margin-bottom: 14px;
  display: block;
}
.highlight-card h3 {
  font-size: 1.05rem;
  font-weight: 800;
  margin-bottom: 6px;
  color: var(--text);
}
.highlight-card p {
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ── About ── */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
  margin-top: 40px;
}
.about-text p {
  color: var(--text-muted);
  margin-bottom: 18px;
  line-height: 1.75;
  font-size: 1.02rem;
}
.about-text strong { color: var(--text); }
.about-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.about-card {
  width: 100%;
  aspect-ratio: 4/3;
  background: linear-gradient(160deg, var(--primary), #12a5b2);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.about-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 70%, rgba(255,255,255,0.08) 0%, transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%);
}
.about-card-icon {
  font-size: 72px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.about-card h3 {
  font-size: 1.3rem;
  font-weight: 800;
  position: relative;
  z-index: 1;
  margin-bottom: 4px;
}
.about-card p {
  font-size: 0.9rem;
  opacity: 0.8;
  position: relative;
  z-index: 1;
}
.about-float {
  position: absolute;
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 16px 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  z-index: 3;
}
.about-float.top-right {
  top: -16px;
  right: -16px;
}
.about-float.bottom-left {
  bottom: -16px;
  left: -16px;
}
.about-float .af-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.about-float .af-icon.teal { background: var(--primary-light); }
.about-float .af-icon.amber { background: #fef3c7; }

/* ── Services ── */
.services-section {
  background: linear-gradient(180deg, var(--bg) 0%, #eef7f8 100%);
}
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
  margin-top: 40px;
}
.service-card {
  background: var(--surface);
  border: var(--border);
  border-radius: var(--radius);
  padding: 36px 30px;
  transition: all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  position: relative;
  overflow: hidden;
}
.service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  opacity: 0;
  transition: opacity 0.35s;
}
.service-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-hover);
  border-color: rgba(14,124,134,0.2);
}
.service-card:hover::before { opacity: 1; }
.service-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 18px;
  background: var(--primary-light);
  transition: all 0.3s;
}
.service-card:hover .service-icon {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  transform: scale(1.08);
}
.service-card:hover .service-icon span { filter: brightness(10); }
.service-card h3 {
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 10px;
  color: var(--text);
  line-height: 1.3;
}
.service-card p {
  font-size: 0.92rem;
  color: var(--text-muted);
  line-height: 1.65;
}

/* ── Why Us ── */
.why-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 28px;
  margin-top: 40px;
}
.why-card {
  text-align: center;
  padding: 40px 28px;
  border-radius: var(--radius);
  background: var(--surface);
  border: var(--border);
  box-shadow: var(--shadow);
  transition: all 0.35s;
}
.why-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}
.why-icon {
  width: 68px;
  height: 68px;
  margin: 0 auto 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  background: linear-gradient(135deg, var(--primary-light), #d1f0f1);
  transition: all 0.3s;
}
.why-card:hover .why-icon {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  transform: scale(1.1);
}
.why-card h3 {
  font-size: 1.05rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.why-card p {
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.6;
}

/* ── Contact ── */
.contact-section {
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
}
.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-top: 40px;
}
.contact-info-card {
  background: var(--surface);
  border: var(--border);
  border-radius: var(--radius);
  padding: 40px;
  box-shadow: var(--shadow);
}
.contact-info-card h3 {
  font-size: 1.3rem;
  font-weight: 800;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 18px 0;
  border-bottom: 1px solid rgba(14,124,134,0.08);
}
.contact-item:last-child { border-bottom: none; }
.contact-item-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.contact-item h4 {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.contact-item p,
.contact-item a {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  line-height: 1.5;
}
.contact-item a:hover { color: var(--primary); }
.contact-map-card {
  background: linear-gradient(160deg, var(--primary), #12a5b2);
  border-radius: var(--radius);
  padding: 40px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.contact-map-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,0.04) 0%, transparent 50%);
}
.contact-map-card > * { position: relative; z-index: 1; }
.contact-map-card h3 {
  font-size: 1.3rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.contact-map-card > p {
  opacity: 0.8;
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 28px;
}
.hours-grid {
  display: grid;
  gap: 10px;
}
.hours-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 16px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  font-size: 0.92rem;
  backdrop-filter: blur(4px);
}
.hours-row .day { font-weight: 600; }
.hours-row .time { font-weight: 700; color: var(--accent); }
.contact-map-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 14px;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
  width: fit-content;
}
.contact-map-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-2px);
}

/* ── CTA Banner ── */
.cta-banner {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  padding: 70px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 10% 50%, rgba(245,158,11,0.15) 0%, transparent 50%),
    radial-gradient(circle at 90% 50%, rgba(255,255,255,0.05) 0%, transparent 50%);
}
.cta-banner > * { position: relative; z-index: 1; }
.cta-banner h2 {
  font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  font-weight: 900;
  color: #fff;
  margin-bottom: 12px;
  line-height: 1.2;
}
.cta-banner p {
  color: rgba(255,255,255,0.75);
  font-size: 1.05rem;
  margin-bottom: 28px;
}
.cta-banner .btn-primary {
  font-size: 18px;
  padding: 18px 42px;
}

/* ── Footer ── */
.footer {
  background: #0a1f24;
  color: rgba(255,255,255,0.6);
  padding: 50px 24px 30px;
}
.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 30px;
}
.footer-brand h3 {
  color: #fff;
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.footer-brand p {
  font-size: 0.88rem;
  line-height: 1.6;
  max-width: 320px;
}
.footer-links h4 {
  color: rgba(255,255,255,0.9);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.footer-links a {
  display: block;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 4px 0;
  transition: color 0.3s;
}
.footer-links a:hover { color: var(--accent); }
.footer-bottom {
  max-width: 1100px;
  margin: 30px auto 0;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.08);
  text-align: center;
  font-size: 0.82rem;
  color: rgba(255,255,255,0.35);
}

/* ── Floating WhatsApp ── */
.whatsapp-float {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 999;
  width: 62px;
  height: 62px;
  background: #25d366;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 28px rgba(37,211,102,0.4);
  transition: all 0.3s;
  text-decoration: none;
  animation: pulse-wa 2s infinite;
}
.whatsapp-float:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 36px rgba(37,211,102,0.55);
}
.whatsapp-float svg {
  width: 32px;
  height: 32px;
  fill: #fff;
}
@keyframes pulse-wa {
  0%, 100% { box-shadow: 0 6px 28px rgba(37,211,102,0.4); }
  50% { box-shadow: 0 6px 28px rgba(37,211,102,0.4), 0 0 0 12px rgba(37,211,102,0.12); }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .topbar-inner { height: 60px; }
  .logo-text { font-size: 14px; }
  .logo-text span { font-size: 10px; }
  .btn-call { padding: 10px 18px; font-size: 13px; }
  .hero { min-height: 80vh; padding: 60px 20px; }
  .hero h1 { font-size: 2rem; }
  .hero-phone { font-size: 1.2rem; padding: 14px 24px; }
  .hero-ctas { flex-direction: column; align-items: center; }
  .btn-primary, .btn-secondary { width: 100%; justify-content: center; max-width: 300px; }
  .highlight-card { border-right: none; border-bottom: var(--border); padding: 28px 20px; }
  .highlight-card:last-child { border-bottom: none; }
